[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dira-scan"
version = "1.2.0"
description = "DIRA — zero-dependency security audit for startup codebases: secrets, dependency CVEs, misconfigurations, git-history leaks, live surface checks, and a startup security-readiness score."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yusuf Gadelrab", email = "yusuf.gadelrab06@gmail.com" }]
keywords = [
    "security", "sast", "secrets", "secret-scanning", "vulnerability",
    "osv", "sarif", "devsecops", "soc2", "startup", "audit", "supply-chain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Yusuf-Gadelrab/dira"
Repository = "https://github.com/Yusuf-Gadelrab/dira"
Issues = "https://github.com/Yusuf-Gadelrab/dira/issues"

[project.scripts]
dira = "dira.cli:main"
dira-scan = "dira.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["dira"]

[tool.hatch.build.targets.sdist]
include = [
    "/dira",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/LICENSE",
    "/action.yml",
    "/.pre-commit-hooks.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
