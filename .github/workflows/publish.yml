name: publish

# Publishes on a version tag. Uses PyPI Trusted Publishing (OIDC) — no API token
# is ever stored in this repo. npm needs an NPM_TOKEN secret because npm's
# trusted publishing does not cover this launcher-package layout.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write        # required for trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build
      - name: Verify the wheel actually runs
        run: |
          pip install dist/*.whl
          dira --version
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
